services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    container_name: loggerizer-dev
    volumes:
      - ..:/workspaces/loggerizer:cached
    working_dir: /workspaces/loggerizer
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      - mailhog
    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - loggerizer-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: loggerizer-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - loggerizer-network

networks:
  loggerizer-network:
    driver: bridge
